spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/${MYSQL_DATABASE:gamehub}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
  elasticsearch:
    uris: ${ELASTICSEARCH_HOST:http://localhost:9200}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
gamehub:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
