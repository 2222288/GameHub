server:
  port: 8080
  forward-headers-strategy: framework
spring:
  application:
    name: gamehub
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:3306/${MYSQL_DATABASE:gamehub}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:gamehub}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
  elasticsearch:
    uris: ${ELASTICSEARCH_HOST:http://elasticsearch:9200}
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: 5672
    username: ${RABBITMQ_USER:gamehub}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 5
          multiplier: 2
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deletedAt
      logic-delete-value: 'now()'
      logic-not-delete-value: 'null'
logging:
  level:
    com.gamehub: INFO
gamehub:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: 86400
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://minio:9000}
    access-key: ${MINIO_ACCESS_KEY:gamehub}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: gamehub
