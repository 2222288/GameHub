services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gamehub}
      MYSQL_USER: ${MYSQL_USER:-gamehub}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Generate .env first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Generate .env first}
    ports: ["127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/gamehub_init.sql:/docker-entrypoint-initdb.d/01-gamehub.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["127.0.0.1:9200:9200"]
    volumes: ["es-data:/usr/share/elasticsearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s'"]
      interval: 15s
      timeout: 10s
      retries: 30
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-gamehub}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Generate .env first}
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    volumes: ["rabbit-data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-gamehub}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Generate .env first}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio-data:/data"]
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gamehub}
      MYSQL_USER: ${MYSQL_USER:-gamehub}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Generate .env first}
      RABBITMQ_USER: ${RABBITMQ_USER:-gamehub}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Generate .env first}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-gamehub}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Generate .env first}
      JWT_SECRET: ${JWT_SECRET:?Generate .env first}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Generate .env first}
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      elasticsearch: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      minio: {condition: service_started}
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports: ["${APP_PORT:-8088}:80"]
    depends_on:
      backend: {condition: service_started}
      minio: {condition: service_started}
    restart: unless-stopped
volumes:
  mysql-data:
  redis-data:
  es-data:
  rabbit-data:
  minio-data:
